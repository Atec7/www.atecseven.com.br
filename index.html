<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G26 New · Programação de Redes Elétricas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-screen">
  <div id="login-bg" aria-hidden="true">
    <img class="bg-img" src="img/fundo.jpeg" alt="">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="pulse"></div>
    <div class="grid"></div>
  </div>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">G26</div>
      <div><h1>New</h1></div>
    </div>
    <div class="login-status" id="login-status"></div>
    <div class="field"><label>Usuário</label><input id="login-user" autocomplete="username" placeholder="ex.: 1"></div>
    <div class="field"><label>Senha</label>
      <div class="pwd-wrap">
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••">
        <button type="button" class="pwd-eye" id="pwd-eye" title="Mostrar senha" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <label class="login-remember"><input type="checkbox" id="login-remember"> Lembrar usuário e senha neste aparelho</label>
    <button class="btn btn-primary btn-block" id="login-btn">Entrar</button>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">G2</div>
      <div class="brand-text"><h1>G26 New</h1><span>Programação &amp; Manutenção</span></div>
    </div>
    <nav class="nav" id="nav"></nav>

  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-ghost mobile-toggle" id="mobile-toggle">☰</button>
        <div><h2 id="page-title">Painel</h2><div class="sub" id="page-sub">Visão geral do sistema</div></div>
      </div>
      <div id="topbar-actions"></div>
    </div>
    <div id="banner-area"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>
<input type="file" id="import-file" accept="application/json" style="display:none">
<div id="print-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
