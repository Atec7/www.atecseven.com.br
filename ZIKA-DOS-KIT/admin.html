<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zika dos Kit • Painel do Administrador</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E0B09">
  <link rel="icon" href="icon.jpg">
  <style>
    html,body{margin:0;height:100%;background:#0E0B09;overflow:hidden}
    iframe{border:0;width:100%;height:100%;display:block}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0E0B09;transition:opacity .4s;z-index:2}
    #splash img{width:min(300px,70vw);border-radius:16px;border:3px solid #000;box-shadow:8px 8px 0 #FF7A00}
    #splash i{width:26px;height:26px;border:3px solid rgba(255,210,31,.25);border-top-color:#FFD21F;border-radius:50%;animation:s .7s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="splash"><img src="logo.jpeg" alt="Zika dos Kit"><i></i></div>
  <!-- 👇 Cole aqui a URL do seu App da Web + ?page=admin -->
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbzwiEl-0BxPaYdU-qUxOY6XvWBLPeNlpLk_kht8ptqSffQl9NsWnZR-aOkxeQ5IlQI7nA/exec?page=admin" title="Zika dos Kit - Painel" allow="clipboard-write; clipboard-read"></iframe>
  <script>
    document.getElementById('app').addEventListener('load', function () {
      var s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(function () { s.remove(); }, 450);
    });
  </script>
</body>
</html>
