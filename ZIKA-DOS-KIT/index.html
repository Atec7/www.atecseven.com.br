<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zika dos Kit • Loja virtual estilo favela</title>
  <meta name="description" content="Kits completos, bonés, camisetas, bermudas, tênis e acessórios com a cara da quebrada. Peça online e pague no Pix.">
  <meta name="theme-color" content="#0E0B09">
  <!-- Pré-visualização no WhatsApp/Instagram: troque pelo endereço completo do seu site -->
  <meta property="og:title" content="Zika dos Kit • Loja virtual estilo favela">
  <meta property="og:description" content="Monta teu kit e chega no estilo. Peça online!">
  <meta property="og:image" content="logo.jpeg">
  <link rel="icon" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <style>
    html,body{margin:0;height:100%;background:#0E0B09;overflow:hidden}
    iframe{border:0;width:100%;height:100%;display:block}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0E0B09;transition:opacity .4s;z-index:2}
    #splash img{width:min(340px,72vw);border-radius:16px;border:3px solid #000;box-shadow:8px 8px 0 #FF7A00}
    #splash i{width:26px;height:26px;border:3px solid rgba(255,210,31,.25);border-top-color:#FFD21F;border-radius:50%;animation:s .7s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="splash"><img src="logo.jpeg" alt="Zika dos Kit"><i></i></div>
  <!-- 👇 Cole aqui a URL do seu App da Web (termina em /exec) -->
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbyBn7Q3ZPyMpZYUJRbIk860g9RXsDvOW4zi8WzkfHtsAfqH4Sh2I_3bkBeCynC6O3THJw/exec" title="Zika dos Kit - Loja" allow="clipboard-write; clipboard-read"></iframe>
  <script>
    document.getElementById('app').addEventListener('load', function () {
      var s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(function () { s.remove(); }, 450);
    });
  </script>
</body>
</html>
