<!DOCTYPE html>
<!--
  SevenDesk · Atecseven Service Portal
  Página de acesso (iframe) — publique este arquivo no seu site ou hospedagem.

  COMO USAR
  1. Cole abaixo, em APP_URL, a URL do App da Web (termina em /exec).
  2. Publique este arquivo, por exemplo em  https://www.atecseven.com.br/chamados/
     (renomeie para index.html dentro da pasta "chamados").
  3. Na planilha, aba Configurações → URL_PORTAL, coloque o endereço desta página.
     Assim os botões dos e-mails abrem o portal por aqui, sem o aviso do Google.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SevenDesk · Portal de Chamados Atecseven</title>
<meta name="description" content="Portal de chamados Atecseven: abra, acompanhe e avalie suas solicitações de suporte.">
<meta name="theme-color" content="#00337A">
<meta name="robots" content="noindex">
<meta property="og:title" content="SevenDesk · Portal de Chamados Atecseven">
<meta property="og:description" content="Abra, acompanhe e avalie seus chamados de suporte.">
<meta property="og:image" content="https://www.atecseven.com.br/logo2.png">
<link rel="icon" href="https://www.atecseven.com.br/logo2.png" type="image/png">
<link rel="apple-touch-icon" href="https://www.atecseven.com.br/logo2.png">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F4F7FB; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { html, body { background: #071021; } }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; opacity: 0; transition: opacity .35s ease; }
  #app.ready { opacity: 1; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: #fff; z-index: 2; transition: opacity .4s ease;
    background: radial-gradient(900px 520px at 85% 90%, rgba(0,194,224,.45) 0%, transparent 60%), radial-gradient(900px 600px at 0% 0%, rgba(0,87,199,.85) 0%, transparent 60%), linear-gradient(160deg, #071021, #00337A 70%); }
  #loader.out { opacity: 0; pointer-events: none; }
  #loader img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 18px 40px -12px rgba(0,194,224,.55); animation: pulse 1.6s ease-in-out infinite; }
  #loader h1 { margin: 22px 0 4px; font-size: 22px; letter-spacing: -.3px; font-weight: 800; }
  #loader p { margin: 0; font-size: 14px; opacity: .8; }
  .bar { width: 180px; height: 4px; margin: 22px auto 0; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #00C2E0, #fff); animation: slide 1.2s ease-in-out infinite; }
  #slow { display: none; margin-top: 18px; font-size: 13px; opacity: .85; }
  #slow a { color: #7DE6F5; }
  @keyframes pulse { 50% { transform: scale(.93); opacity: .8; } }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  .setup { max-width: 520px; padding: 28px; border-radius: 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); text-align: left; line-height: 1.6; font-size: 14px; }
  .setup code { background: rgba(0,0,0,.3); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div>
    <img src="https://www.atecseven.com.br/logo2.png" alt="Atecseven">
    <h1>SevenDesk</h1>
    <p>Portal de Chamados · Atecseven</p>
    <div class="bar"><span></span></div>
    <div id="slow">Está demorando mais que o normal… <a id="direct" href="#" target="_top">abrir o portal diretamente</a></div>
  </div>
</div>

<iframe id="app" title="SevenDesk · Portal de Chamados" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbx2NxMUInPihXklZMB4RqNBmPoTISr1-VYkLlcx2f3_pJuywKCQXwmoXC1dGuui3EL5/exec';

  (function () {
    const loader = document.getElementById('loader');
    const frame = document.getElementById('app');
    const configured = /^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL);

    if (!configured) {
      loader.querySelector('div').innerHTML =
        '<div class="setup"><h1 style="margin-top:0">Configuração pendente</h1>' +
        'Abra este arquivo em um editor de texto e cole em <code>APP_URL</code> a URL do App da Web ' +
        '(Apps Script → <b>Implantar → Gerenciar implantações</b>), que termina em <code>/exec</code>.</div>';
      return;
    }

    // Repassa ao portal os parâmetros dos links de e-mail (?ticket=SD-2026-00001&acao=avaliar&nota=5).
    const params = new URLSearchParams(location.search);
    const pass = new URLSearchParams();
    ['ticket', 'acao', 'nota'].forEach(k => { if (params.get(k)) pass.set(k, params.get(k)); });
    const src = APP_URL + (pass.toString() ? '?' + pass.toString() : '');
    document.getElementById('direct').href = src;

    let shown = false;
    const show = () => {
      if (shown) return;
      shown = true;
      frame.classList.add('ready');
      loader.classList.add('out');
      setTimeout(() => loader.remove(), 450);
    };
    frame.addEventListener('load', () => setTimeout(show, 600));
    setTimeout(() => { document.getElementById('slow').style.display = 'block'; }, 12000);
    setTimeout(show, 25000);
    frame.src = src;

    // Limpa os parâmetros da barra de endereço depois de repassá-los (evita reabrir a mesma ação ao recarregar).
    if (pass.toString() && history.replaceState) history.replaceState(null, '', location.pathname);
  })();
</script>
</body>
</html>
